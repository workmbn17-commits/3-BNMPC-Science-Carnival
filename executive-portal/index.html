<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070909" />
  <meta name="robots" content="noindex,nofollow" />
  <title>3ʳᵈ BNMPC Science Carnival — Executive Portal</title>
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <style>
    html,body{min-height:100%;margin:0;background:#070909;color:#f7faf8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .gate{width:min(520px,100%);border:1px solid #2c3330;background:#101313;padding:28px}
    .mark{width:34px;height:34px;display:grid;place-items:center;background:#12724c;border:1px solid #15915d;color:#f7faf8;font-weight:800}
    .kicker{margin-top:22px;color:#1bbd78;font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:8px 0 0;font-size:24px;letter-spacing:-.03em}
    p{margin:8px 0 0;color:#7c8782;font-size:11px;line-height:1.7}
    .status{margin-top:22px;padding:11px 12px;border:1px solid #232927;background:#151918;color:#a6b0ab;font:700 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}
    .dot{display:inline-block;width:6px;height:6px;background:#1bbd78;margin-right:7px}
  </style>
  <script>
    window.location.replace('login.html');
  </script>
</head>
<body>
  <main class="gate" aria-live="polite">
    <div class="mark" aria-hidden="true">B</div>
    <div class="kicker">Executive Control</div>
    <h1>3ʳᵈ BNMPC National Science Carnival</h1>
    <p>Opening the authenticated executive portal.</p>
    <div class="status"><span class="dot"></span>Redirecting to secure sign in</div>
  </main>
</body>
</html>
