<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0047AB"><title>Register — 3rd BNMPC National Science Carnival</title><link rel="stylesheet" href="assets/css/theme.css"><style>#participationWrap[hidden]{display:none!important}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">3</span><span><b>3rd BNMPC</b><small>National Science Carnival 2026</small></span></a><nav><a href="events.html">Events</a><a class="nav-cta active" href="register.html">Register</a></nav></header><main class="page"><section class="page-heading"><p class="eyebrow">Registration</p><h1>Enter the carnival</h1><p>Complete the form below. Your submission will be reviewed by the carnival team.</p></section><form id="registrationForm" class="form-shell"><div class="form-section"><div class="section-title">Event selection</div><div class="form-grid"><label>Event<select id="eventSelect" required><option value="">Loading events…</option></select></label><label id="segmentWrap">Subsegment<select id="segmentSelect"><option value="">Select an event first</option></select></label><label id="participationWrap" hidden>Participation<select id="participationType" required><option value="individual">Individual</option><option value="team">Team</option></select></label><label>Class group<select id="classGroup" required><option value="">Select class group</option></select></label></div></div><div class="form-section"><div class="section-title">Participant</div><div class="form-grid"><label>Full name<input id="participantName" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required></label><label>Institution<input id="institution" required></label><label class="full">Address<textarea id="address" rows="2"></textarea></label></div></div><div class="form-section team-section" id="teamSection"><div class="section-title">Team details</div><div class="form-grid"><label>Team name<input id="teamName"></label></div><div id="teamMembers" class="team-members"></div><button type="button" class="button ghost small" id="addMember">+ Add member</button></div><div class="form-section project-section" id="projectSection"><div class="section-title">Project / submission</div><div class="form-grid"><label class="full">Project / submission title<input id="projectName"></label></div></div><div class="form-section payment-section" id="paymentSection"><div class="section-title">Payment</div><p id="feeNotice"></p><div class="form-grid"><label>Payment method<input id="paymentMethod" placeholder="e.g. bKash / Nagad"></label><label>Transaction ID<input id="transactionId"></label></div></div><div id="rulesBox" class="rules-box"></div><div id="error" class="error" hidden></div><button class="button primary submit" type="submit">Submit registration <span>→</span></button></form></main><footer><span>3rd BNMPC National Science Carnival</span><span>Registration Portal</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/app.js"></script><script src="assets/js/register-final-clean.js"></script></body></html>
